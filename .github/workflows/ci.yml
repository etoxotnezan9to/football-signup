name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        # Строго по lockfile; если он устарел (добавили зависимости), обновляем его — см. следующий шаг
        run: |
          if [ -f pnpm-lock.yaml ] && pnpm install --frozen-lockfile; then exit 0; fi
          pnpm install --no-frozen-lockfile
      - name: Commit lockfile if it changed
        # Только для develop-claude: разработка идёт без доступа к реестру npm, lockfile обновляет CI.
        # В остальных ветках и PR устаревший lockfile остаётся ошибкой (шаг выше упадёт).
        if: github.event_name == 'push' && github.ref_name == 'develop-claude'
        run: |
          if [ -n "$(git status --porcelain pnpm-lock.yaml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: update pnpm-lock.yaml"
            git pull --rebase origin develop-claude
            git push
          fi
      - run: ci/run.sh lint pnpm lint
      - run: ci/run.sh typecheck pnpm typecheck
      - run: ci/run.sh test pnpm test
      - run: ci/run.sh build pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        if: hashFiles('pnpm-lock.yaml') != ''
        run: docker build -f apps/api/Dockerfile -t football-api:ci .
      - name: Smoke test
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          docker run -d --name api -p 3000:3000 -e VK_APP_ID=54809461 -e VK_APP_SECRET=ci-secret football-api:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs api
          test "${ok:-0}" = "1"
