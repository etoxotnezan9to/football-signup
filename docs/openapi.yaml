openapi: 3.0.3
info:
  title: Football signup API
  version: 1.0.0
  description: >
    REST API мини-приложения «Запись на футбол». Авторизация: заголовок
    `Authorization: VK <строка параметров запуска VK>` (подпись проверяется на сервере).
servers:
  - url: /api
security:
  - vkLaunchParams: []
paths:
  /health:
    get:
      summary: Проверка работоспособности
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status, version, time]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string }
                  time: { type: string, format: date-time }
  /me:
    get:
      summary: Текущий пользователь
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
    put:
      summary: Обновить своё отображаемое имя и фото (данные из VKWebAppGetUserInfo)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName]
              properties:
                firstName: { type: string, minLength: 1, maxLength: 64 }
                lastName: { type: string, maxLength: 64 }
                photoUrl: { type: string, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /config:
    get:
      summary: Настройки клиента (включён ли тестовый режим)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [testMode]
                properties:
                  testMode: { type: boolean }
  /games/{gameId}/test-players:
    parameters:
      - { name: gameId, in: path, required: true, schema: { type: integer } }
    post:
      summary: Тестовый режим. Организатор добавляет тестовых игроков (403, если режим выключен)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [count]
              properties:
                count: { type: integer, minimum: 1, maximum: 50 }
                seats: { type: integer, minimum: 1, maximum: 5, default: 1 }
      responses:
        '200':
          description: Игра с обновлённым составом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    delete:
      summary: Тестовый режим. Убрать из игры всех тестовых игроков
      responses:
        '200':
          description: Игра с обновлённым составом
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '403': { $ref: '#/components/responses/Error' }
  /places:
    get:
      summary: Список всех мест (по названию)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Place' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Создать место (любой пользователь)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '200':
          description: Место с таким названием и адресом уже есть, возвращается оно
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /games:
    get:
      description: >-
        Сборы для главной. Отменённые видны всем (свои и чужие), кроме includeCancelled=0.
        Без includePast — только предстоящие. Порядок: предстоящие
        по возрастанию времени, затем прошедшие от новых к старым.
      summary: Список сборов (фильтры главной)
      parameters:
        - { name: includePast, in: query, schema: { type: string, enum: ['0', '1'], default: '0' }, description: 'Показывать прошедшие сборы' }
        - { name: includeCancelled, in: query, schema: { type: string, enum: ['0', '1'], default: '1' }, description: 'Показывать отменённые сборы (свои и чужие)' }
        - { name: placeId, in: query, schema: { type: integer, minimum: 1 }, description: 'Только сборы этой арены' }
        - { name: from, in: query, schema: { type: string, format: date-time }, description: 'Только сборы, которые начинаются не раньше этого момента (неделя на главной)' }
        - { name: to, in: query, schema: { type: string, format: date-time }, description: 'Только сборы, которые начинаются раньше этого момента; должно быть позже from' }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GameSummary' }
                  nextCursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      summary: Создать игру
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameInput' }
      responses:
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /games/{gameId}:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
    get:
      summary: Игра с составом
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: Изменить игру (только организатор)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /games/{gameId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
    post:
      summary: Отменить игру (только организатор)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /games/{gameId}/signup:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
    put:
      summary: Записаться или изменить число мест
      description: Идемпотентно. `seats` — желаемое итоговое число мест.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seats]
              properties:
                seats: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200':
          description: Результат записи
          content:
            application/json:
              schema:
                type: object
                required: [signup, game]
                properties:
                  signup: { $ref: '#/components/schemas/RosterEntry' }
                  game: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      summary: Отменить свою запись
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /games/{gameId}/signups/{signupId}:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
      - { name: signupId, in: path, required: true, schema: { type: integer } }
    patch:
      summary: Отметить оплату (только организатор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paidSeats]
              properties:
                paidSeats: { type: integer, minimum: 0, maximum: 5 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: Удалить участника (только организатор)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /games/{gameId}/teams/{teamNo}:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
      - { name: teamNo, in: path, required: true, schema: { type: integer, minimum: 1 }, description: Номер команды, от 1 до teamsMax }
    put:
      summary: Переименовать команду (только организатор)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 30 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /games/{gameId}/teams/{teamNo}/color:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
      - { name: teamNo, in: path, required: true, schema: { type: integer, minimum: 1 }, description: Номер команды, от 1 до teamsMax }
    put:
      summary: Выбрать цвет команды (только организатор)
      description: >-
        color — ключ из набора TEAM_COLORS (packages/shared). Цвет другой команды сбора выбрать нельзя
        (VALIDATION_ERROR с details.color). Название команды становится названием цвета; цвета остальных команд
        закрепляются как есть.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [color]
              properties:
                color: { type: string, example: black }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /games/{gameId}/matches/{teamA}/{teamB}/{leg}:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
      - { name: teamA, in: path, required: true, schema: { type: integer, minimum: 1 }, description: Номер команды }
      - { name: teamB, in: path, required: true, schema: { type: integer, minimum: 1 }, description: Номер соперника }
      - { name: leg, in: path, required: true, schema: { type: integer, minimum: 1 }, description: 'Номер встречи этой пары, от 1 до meetings' }
    put:
      summary: Записать счёт встречи команд (только организатор; можно и после окончания игры)
      description: Порядок команд любой, голы в том же порядке. В ответе results хранятся с teamA < teamB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [goalsA, goalsB]
              properties:
                goalsA: { type: integer, minimum: 0, maximum: 99 }
                goalsB: { type: integer, minimum: 0, maximum: 99 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: Стереть счёт встречи (только организатор)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /games/{gameId}/match-order:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
    put:
      summary: Задать порядок встреч (только организатор, перетаскиванием на вкладке «Результаты»)
      description: >-
        order — ключи всех встреч сбора «teamA-teamB-leg» (teamA < teamB), каждая по одному разу; иначе
        VALIDATION_ERROR с details.order. order null возвращает порядок по умолчанию: как можно меньше матчей подряд
        у любой команды, затем как можно меньше ожиданий подряд, затем как можно ровнее между командами
        (defaultMatchOrder в packages/shared, готовые порядки в match-orders.generated.ts).
        Если потом меняется число команд или встреч, сохранённый порядок не подходит и действует порядок по умолчанию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [order]
              properties:
                order: { type: array, nullable: true, items: { type: string, example: '1-2-1' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /games/{gameId}/best-player:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
    put:
      summary: Выбрать лучшего игрока сбора (только организатор; можно и после окончания игры)
      description: >-
        Выбирается из записавшихся (без их друзей), кто сейчас в командах; иначе VALIDATION_ERROR с details.userId.
        userId null снимает выбор. В рейтинге лучший игрок получает 2 очка за сбор вместо 1 за победу команды.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: integer, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /games/{gameId}/team-assignment:
    parameters:
      - { $ref: '#/components/parameters/GameId' }
    put:
      summary: Отправить место состава в команду или убрать из команд (только организатор)
      description: >-
        Место (seat от 1 до mainSeats записи) встаёт в конец команды teamNo; teamNo null убирает его из команд.
        В заполненную команду (playersPerTeam игроков) нельзя: TEAM_FULL. Места из очереди не распределяются: VALIDATION_ERROR.
        Места, только что попавшие в состав, сервер распределяет сам (см. spec.md, Team); убранное отсюда место само не возвращается.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signupId, seat, teamNo]
              properties:
                signupId: { type: integer }
                seat: { type: integer, minimum: 1 }
                teamNo: { type: integer, minimum: 1, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameDetails' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /rating:
    get:
      summary: Рейтинг игроков по сборам с сохранённым счётом
      description: >-
        Все записавшиеся (без их друзей по записи), кто был в команде хотя бы в одном неотменённом сборе
        с сохранённым счётом. Каждая встреча — матч его команды. Победа в сборе — первое место команды
        в турнирной таблице сбора (при полном равенстве с второй командой победителя нет); за неё 1 очко,
        лучшему игроку сбора — 2 очка вместо этого (не складываются).
        Порядок: очки, доля побед в матчах, победы, сыграно матчей. Логика — computeRating в packages/shared.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RatingRow' }
        '401': { $ref: '#/components/responses/Error' }
  /me/organized:
    get:
      summary: Все мои сборы, включая прошедшие и отменённые (для «Копировать сбор»)
      description: Новые сверху, не больше 50. Подробности сбора — GET /games/{gameId}.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/GameSummary' }
        '401': { $ref: '#/components/responses/Error' }
  /me/games:
    get:
      summary: Мои сборы (созданные и те, куда я записан)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [organized, joined]
                properties:
                  organized:
                    type: array
                    items: { $ref: '#/components/schemas/GameSummary' }
                  joined:
                    type: array
                    items: { $ref: '#/components/schemas/GameSummary' }
        '401': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    vkLaunchParams:
      type: apiKey
      in: header
      name: Authorization
      description: 'Формат: `VK <строка параметров запуска>`'
  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: integer }
  responses:
    Error:
      description: Ошибка
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorBody' }
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - VALIDATION_ERROR
                - SEATS_LIMIT_EXCEEDED
                - GAME_NOT_ACTIVE
                - ACTIVE_GAMES_LIMIT
                - STARTS_AT_IN_PAST
                - TEAM_FULL
                - RATE_LIMITED
                - INTERNAL
            message: { type: string }
            details:
              type: object
              additionalProperties: { type: string }
              description: Ошибки по полям (для VALIDATION_ERROR)
    User:
      type: object
      required: [vkId, firstName, lastName]
      properties:
        vkId: { type: integer }
        firstName: { type: string }
        lastName: { type: string }
        photoUrl: { type: string, nullable: true }
    Place:
      type: object
      required: [id, name, address]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
    PlaceInput:
      type: object
      required: [name, address]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        address: { type: string, minLength: 1, maxLength: 160 }
    GameInput:
      type: object
      required: [startsAt, placeId, teamsMax, playersPerTeam, feeRub]
      description: Вместимость (capacity) не передаётся, сервер считает её как teamsMax × playersPerTeam
      properties:
        startsAt: { type: string, format: date-time }
        placeId: { type: integer, minimum: 1, description: 'Место; неизвестное — VALIDATION_ERROR с details.placeId' }
        teamsMax: { type: integer, minimum: 2, maximum: 10, description: Максимум команд }
        playersPerTeam: { type: integer, minimum: 1, maximum: 11, description: 'Игроков в команде; teamsMax × playersPerTeam не больше 60, иначе VALIDATION_ERROR с details.playersPerTeam' }
        meetings: { type: integer, minimum: 1, maximum: 10, default: 2, description: Сколько раз каждая пара команд играет между собой }
        feeRub: { type: integer, minimum: 0, maximum: 100000 }
        description: { type: string, maxLength: 1000, default: '' }
        paymentInfo: { type: string, maxLength: 300, default: '' }
        organizerContact: { type: string, maxLength: 120, default: '' }
        teamColors:
          type: array
          maxItems: 10
          items: { type: string }
          description: >-
            Только при создании: цвета команд по номерам с 1 (ключи TEAM_COLORS, без повторов), например скопированные
            из другого сбора; названия команд — названия цветов. Иначе VALIDATION_ERROR с details.teamColors
    GameUpdate:
      type: object
      description: Любое подмножество полей GameInput; при изменении teamsMax или playersPerTeam сервер пересчитывает capacity
      properties:
        startsAt: { type: string, format: date-time }
        placeId: { type: integer, minimum: 1 }
        teamsMax: { type: integer, minimum: 2, maximum: 10 }
        playersPerTeam: { type: integer, minimum: 1, maximum: 11 }
        meetings: { type: integer, minimum: 1, maximum: 10 }
        feeRub: { type: integer, minimum: 0, maximum: 100000 }
        description: { type: string, maxLength: 1000 }
        paymentInfo: { type: string, maxLength: 300 }
        organizerContact: { type: string, maxLength: 120 }
    GameSummary:
      type: object
      required: [id, startsAt, placeId, venue, feeRub, capacity, status, isFinished, taken, queued, organizer]
      properties:
        id: { type: integer }
        startsAt: { type: string, format: date-time }
        placeId: { type: integer }
        venue: { type: string, description: Название места }
        feeRub: { type: integer }
        capacity: { type: integer, description: Мест в составе = teamsMax × playersPerTeam }
        status: { type: string, enum: [active, cancelled] }
        isFinished: { type: boolean }
        taken: { type: integer, description: Занято мест в составе }
        queued: { type: integer, description: Мест в очереди }
        organizer: { $ref: '#/components/schemas/User' }
        mySeats: { type: integer, description: Мои места суммарно, 0 если нет записи }
    RatingRow:
      type: object
      required: [user, matches, gatherings, bestPlayer, points]
      properties:
        user: { $ref: '#/components/schemas/User' }
        matches:
          type: object
          required: [played, won, drawn, lost]
          properties:
            played: { type: integer }
            won: { type: integer }
            drawn: { type: integer }
            lost: { type: integer }
        gatherings:
          type: object
          description: Сборы с сохранённым счётом, где игрок был в команде, и победы в них
          required: [played, won]
          properties:
            played: { type: integer }
            won: { type: integer }
        bestPlayer: { type: integer, description: Сколько раз игрок был лучшим игроком сбора }
        points: { type: integer, description: 'Персональные очки за каждый сбор: 2 лучшему игроку, иначе 1 за победу команды' }
    TeamSeat:
      type: object
      description: Одно место записи; запись «+3» даёт места 1, 2, 3
      required: [signupId, seat]
      properties:
        signupId: { type: integer }
        seat: { type: integer, minimum: 1 }
    MatchResult:
      type: object
      description: Счёт встречи leg команд teamA < teamB
      required: [teamA, teamB, leg, goalsA, goalsB]
      properties:
        teamA: { type: integer, minimum: 1 }
        teamB: { type: integer, minimum: 2 }
        leg: { type: integer, minimum: 1, description: 'Номер встречи этой пары, от 1 до meetings' }
        goalsA: { type: integer, minimum: 0, maximum: 99 }
        goalsB: { type: integer, minimum: 0, maximum: 99 }
    MatchSlot:
      type: object
      description: Встреча leg команд teamA < teamB
      required: [teamA, teamB, leg]
      properties:
        teamA: { type: integer, minimum: 1 }
        teamB: { type: integer, minimum: 2 }
        leg: { type: integer, minimum: 1 }
    Team:
      type: object
      required: [no, name, colorKey, color, members]
      properties:
        no: { type: integer, minimum: 1 }
        name: { type: string, description: 'Заданное организатором или название цвета: «Синие», «Розовые», «Чёрные», …' }
        colorKey: { type: string, description: 'Ключ цвета из TEAM_COLORS (packages/shared)' }
        color: { type: string, description: 'Цвет команды, #rrggbb' }
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamSeat' }
    RosterEntry:
      type: object
      required: [signupId, user, seats, mainSeats, queueSeats, queuePosition, paidSeats, createdAt]
      properties:
        signupId: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        seats: { type: integer }
        mainSeats: { type: integer, description: Мест в составе }
        queueSeats: { type: integer, description: Мест в очереди }
        queuePosition:
          type: integer
          nullable: true
          description: >-
            С какого места очереди (с 0) начинаются места записи в очереди; null — в очереди мест нет.
            Очередь показывается в порядке queuePosition (места, добавленные к записи позже, стоят в конце)
        paidSeats: { type: integer }
        createdAt: { type: string, format: date-time }
    GameDetails:
      allOf:
        - $ref: '#/components/schemas/GameSummary'
        - type: object
          required: [address, teamsMax, playersPerTeam, meetings, description, paymentInfo, organizerContact, roster, teams, unassigned, bestPlayerId, results, matches, matchOrderCustom]
          properties:
            address: { type: string, description: Адрес места }
            teamsMax: { type: integer }
            playersPerTeam: { type: integer }
            meetings: { type: integer, description: Сколько раз каждая пара команд играет между собой }
            description: { type: string }
            paymentInfo: { type: string }
            organizerContact: { type: string }
            roster:
              type: array
              description: Все записи в порядке очереди
              items: { $ref: '#/components/schemas/RosterEntry' }
            teams:
              type: array
              description: Команды 1..teamsMax; в каждой не больше playersPerTeam мест из состава
              items: { $ref: '#/components/schemas/Team' }
            unassigned:
              type: array
              description: Места состава, не распределённые по командам, в порядке состава
              items: { $ref: '#/components/schemas/TeamSeat' }
            bestPlayerId:
              type: integer
              nullable: true
              description: vkId лучшего игрока сбора; null — не выбран или вышел из команд
            results:
              type: array
              description: >-
                Счёт сыгранных встреч между командами 1..teamsMax (каждая пара — meetings встреч). Пары и турнирную
                таблицу клиент считает функциями matchPairs и standings из packages/shared
              items: { $ref: '#/components/schemas/MatchResult' }
            matches:
              type: array
              description: Все встречи сбора в порядке проведения (заданном организатором или по умолчанию)
              items: { $ref: '#/components/schemas/MatchSlot' }
            matchOrderCustom: { type: boolean, description: 'Порядок встреч задан организатором' }
